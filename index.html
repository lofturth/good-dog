<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111715">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Good Dog">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/paw-180.png">
    <title>Good Dog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <script src="pwa.js" defer></script>
  </head>
  <body>
    <main id="notebook">
      <header>
        <h1>Good Dog</h1>
        <div id="period-selector" role="group" aria-label="Today’s note period">
          <button type="button" data-period="morning" aria-pressed="false">Morning</button>
          <button type="button" data-period="midday" aria-pressed="false">Midday</button>
          <button type="button" data-period="evening" aria-pressed="false">Evening</button>
          <button type="button" data-period="late-night" aria-pressed="false">Late night</button>
        </div>
        <p id="current-period" class="period-label"></p>
        <p id="period-range"></p>
      </header>
      <button id="record" class="primary" type="button">Record</button>
      <p id="message" role="status"></p>
      <div id="notes" aria-label="Recorded notes"></div>
      <button class="quiet" id="open-history" type="button">History</button>
      <button class="quiet" id="export-json" type="button">Export JSON</button>
    </main>
    <main id="history" hidden>
      <header>
        <button class="quiet" id="close-history" type="button">← Back to notebook</button>
        <h1 id="history-title" tabindex="-1">History</h1>
      </header>
      <p id="history-message" role="status"></p>
      <div id="history-notes"></div>
    </main>
    <form id="editor" hidden aria-label="Record a note">
      <label for="note-text">New note</label>
      <textarea id="note-text" placeholder="Write or dictate a note…"></textarea>
      <p id="editor-message" role="status"></p>
      <div class="actions">
        <button id="cancel" class="secondary" type="button">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </body>
</html>
