<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111715">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Good Dog">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/paw-180.png">
    <title>Observe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <script src="pwa.js" defer></script>
  </head>
  <body>
    <main id="logging-view">
      <header>
        <p class="eyebrow">A MOMENT OF AWARENESS</p>
        <h1>Observe</h1>
        <p class="intro">Notice. Tap. Return.</p>
        <p id="thought-counter" hidden role="status" aria-live="polite" aria-atomic="true">
          <span id="thought-count"></span>
          <span id="thought-period"></span>
        </p>
      </header>

      <div class="observations" aria-label="Record an observation">
        <button class="thought" type="button" data-event="thought">
          <svg viewBox="0 0 64 64" aria-hidden="true" focusable="false">
            <ellipse cx="14" cy="25" rx="6" ry="9" transform="rotate(-25 14 25)"/>
            <ellipse cx="26" cy="16" rx="6" ry="9" transform="rotate(-8 26 16)"/>
            <ellipse cx="40" cy="17" rx="6" ry="9" transform="rotate(12 40 17)"/>
            <ellipse cx="51" cy="28" rx="6" ry="9" transform="rotate(28 51 28)"/>
            <path d="M18 43c2-5 7-15 14-15s12 10 14 15c5 13-7 14-14 10-7 4-21 3-14-10Z"/>
          </svg>
          <span>Thought</span>
        </button>
        <button class="pull" type="button" data-event="subtle-pull">
          <svg viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false">
            <path d="M10 36c8-18 15-18 22 0s14 18 22 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          </svg>
          <span>Subtle pull</span>
        </button>
      </div>

      <p id="acknowledgment" role="status" aria-live="polite" aria-atomic="true"></p>
      <button class="quiet-button" id="open-history" type="button">History</button>
    </main>
    <main id="history-view" hidden>
      <header>
        <button class="quiet-button" id="close-history" type="button">← Back to observing</button>
        <h1 tabindex="-1" id="history-title">History</h1>
        <p class="intro">Observations in your local time.</p>
      </header>
      <button class="quiet-button export-button" id="export-json" type="button">Export JSON</button>
      <p id="history-message" role="status"></p>
      <div id="history-days"></div>
    </main>
  </body>
</html>
